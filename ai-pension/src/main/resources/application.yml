spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/eldercare?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 16        # 最大连接数
          max-idle: 8
          min-idle: 4
          max-wait: 3s
      timeout: 3s

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com    # 兼容 OpenAI 协议的网关可在此切换
      chat:
        options:
          model: deepseek-flash
          temperature: 0.7
          max-tokens: 2000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false  #关闭下划线转驼峰命名
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.easy: info

# ==================== 阿里云 OSS 图片上传 ====================
# 与商城项目共用同一套 OSS 配置，请通过环境变量注入（IDEA Run Configuration → Environment variables）：
# OSS_ENDPOINT / OSS_ACCESS_KEY / OSS_SECRET_KEY / OSS_BUCKET / OSS_PUBLIC_PREFIX（可省略）
oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  access-key: ${OSS_ACCESS_KEY:}
  secret-key: ${OSS_SECRET_KEY:}
  bucket: ai-pension
  public-prefix: 

# ==================== 阿里云短信验证码（号码认证服务） ====================
# 与商城项目共用同一阿里云账号，凭据优先从环境变量读取：
# ALIYUN_ACCESS_KEY / ALIYUN_SECRET_KEY
# enabled=true 走阿里云真实下发；false 则验证码只打印到后端日志（本地联调）
aliyun:
  sms:
    access-key: ${ALIYUN_ACCESS_KEY:}
    secret-key: ${ALIYUN_SECRET_KEY:}
    endpoint: dypnsapi.aliyuncs.com
    sign-name: 恒创联众
    template-code: "100001"
    enabled: true

